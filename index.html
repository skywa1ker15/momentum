<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MOMENTUM - an advanced 3D physics sandbox laboratory." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1018'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%235ad8ff' stroke-width='2.5'/%3E%3C/svg%3E" />
    <title>MOMENTUM - Physics Laboratory</title>
  </head>
  <body>
    <style>
      #boot { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #05070b; color: #e8eef5; font-family: "Inter", "Segoe UI", system-ui, sans-serif; text-align: center; }
      #boot h1 { margin: 0 0 18px; font-size: 30px; font-weight: 300; letter-spacing: 0.42em; margin-right: -0.42em; }
      #boot p { margin: 0; color: #a3afbf; font-size: 13px; letter-spacing: 0.08em; }
      #boot { transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot h1 { animation: boot-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
      #boot p { animation: boot-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(8px); } }
      #boot .bar { width: 180px; height: 2px; margin: 0 auto 16px; background: rgba(255, 255, 255, 0.12); overflow: hidden; border-radius: 2px; }
      /* Indeterminate until the first stage reports in, then a real 0-100% bar. */
      #boot .bar > span { display: block; width: 100%; height: 100%; background: #5ad8ff; transform-origin: left center; }
      #boot .bar > span:not(.determinate) { width: 40%; animation: boot-slide 1.2s ease-in-out infinite; }
      #boot .bar > span.determinate { transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar > span:not(.determinate) { animation: none; width: 100%; opacity: 0.5; }
        #boot h1, #boot p, #boot { animation: none; transition: none; }
      }
    </style>
    <div id="boot" role="status" aria-live="polite">
      <div>
        <h1>MOMENTUM</h1>
        <div class="bar"><span id="boot-bar"></span></div>
        <p id="boot-status">Loading the laboratory</p>
        <noscript><p>MOMENTUM needs JavaScript to run.</p></noscript>
      </div>
    </div>
    <canvas id="render-canvas" tabindex="0" aria-label="MOMENTUM 3D viewport"></canvas>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
